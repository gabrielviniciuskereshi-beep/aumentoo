<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Especial 😂</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #222; 
            /* Configuração da Imagem de Fundo */
            background-image: url('https://media.istockphoto.com/id/1133825734/pt/vetorial/homeless-emoticon.jpg?s=170667a&w=0&k=20&c=3X3xo32bswxRv1GWH9N_mN5Fm3SZVUNIvMo6aRWFOzc=');
            
            /* AJUSTE AQUI: Aumentei para 85% da tela. Se quiser maior, aumente esse número. */
            background-size: 85%; 
            
            background-position: center;
            background-repeat: no-repeat;
        }

        h1 {
            color: white;
            font-size: 32px;
            width: 80%;
            text-shadow: 3px 3px 10px black;
            margin-bottom: 50px;
            z-index: 10;
        }

        .botoes {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 150px;
            z-index: 10;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            
            /* AJUSTE AQUI: Removi a transição (transition) para ele não aumentar de tamanho suavemente */
        }

        #sim {
            background: #28a745;
            color: white;
            position: absolute;
            left: 50px;
            transition: 0.2s; /* O SIM ainda pode dar um feedback visual */
        }

        #sim:hover {
            transform: scale(1.1); /* O SIM cresce um pouquinho no hover */
        }

        #nao {
            background: #dc3545;
            color: white;
            position: absolute;
            right: 50px;
            /* AJUSTE AQUI: Removida qualquer instrução de transição ou hover que fizesse aumentar */
        }

        #agradecimento {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        #agradecimento img {
            width: 250px; /* Aumentei um pouquinho a imagem final também */
            border-radius: 20px;
            box-shadow: 0 0 20px black;
        }

        #agradecimento h2 {
            color: white;
            font-size: 34px;
            text-shadow: 3px 3px 10px black;
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div id="inicio">
    <h1>Super, poderia contribuir com uma esmola?<br>Talvez um aumento?????</h1>
    <div class="botoes">
        <button id="sim">SIM</button>
        <button id="nao">NÃO</button>
    </div>
</div>

<div id="agradecimento">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQocWxCs5RgC0t-8ny3tJLgkWbRIthmiadGPA&s">
    <h2>Obrigado pelo reconhecimento,Super!</h2>
</div>

<script>
    const botaoNao = document.getElementById("nao");

    // Função para o botão fugir
    botaoNao.addEventListener("mouseover", () => {
        // Define o botão como fixed para ele fugir pela tela toda
        botaoNao.style.position = "fixed";
        
        // Calcula posições aleatórias, descontando o tamanho do botão
        const x = Math.random() * (window.innerWidth - botaoNao.offsetWidth - 20);
        const y = Math.random() * (window.innerHeight - botaoNao.offsetHeight - 20);
        
        // Aplica as novas posições instantaneamente (sem transição de tamanho)
        botaoNao.style.left = x + "px";
        botaoNao.style.top = y + "px";
    });

    // Função para o botão SIM
    document.getElementById("sim").addEventListener("click", () => {
        // Esconde o início
        document.getElementById("inicio").style.display = "none";
        
        // Muda o fundo para a imagem de festa
        document.body.style.backgroundImage = "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQocWxCs5RgC0t-8ny3tJLgkWbRIthmiadGPA&s')";
        document.body.style.backgroundSize = "cover"; /* Cobre a tela toda na festa */
        
        // Mostra o agradecimento
        document.getElementById("agradecimento").style.display = "flex";
    });
</script>
</body>
</html>
